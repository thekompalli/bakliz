[alembic]
script_location = %(here)s
prepend_sys_path = .

# This value is overridden by migrations/env.py via DATABASE_URL env var.
sqlalchemy.url = postgresql+psycopg://bakliz:bakliz@localhost:5432/bakliz

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
