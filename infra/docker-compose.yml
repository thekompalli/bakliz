services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bakliz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bakliz}
      POSTGRES_DB: ${POSTGRES_DB:-bakliz}
    ports:
      - "5432:5432"
    volumes:
      - bakliz_pg:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://bakliz:bakliz@postgres:5432/bakliz}
      LINKUP_API_KEY: ${LINKUP_API_KEY:-}
      BAKLIZ_DEMO_MODE: ${BAKLIZ_DEMO_MODE:-false}
      EMAIL_ENRICH_PROVIDER: ${EMAIL_ENRICH_PROVIDER:-linkup}
      ZELIQ_API_KEY: ${ZELIQ_API_KEY:-}
      ZELIQ_CALLBACK_BASE_URL: ${ZELIQ_CALLBACK_BASE_URL:-}
      ZELIQ_WEBHOOK_SECRET: ${ZELIQ_WEBHOOK_SECRET:-}
      ZELIQ_WAIT_SECONDS: ${ZELIQ_WAIT_SECONDS:-0}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_AUTH_MODE: ${GRAPH_AUTH_MODE:-device_code}
      GRAPH_TOKEN_CACHE_PATH: ${GRAPH_TOKEN_CACHE_PATH:-/data/msal_token_cache.bin}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - bakliz_backend_data:/data

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-UTC}
      BAKLIZ_API_BASE_URL: ${BAKLIZ_API_BASE_URL:-http://backend:8000}
      BAKLIZ_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      BAKLIZ_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - bakliz_n8n:/home/node/.n8n
    depends_on:
      - backend

volumes:
  bakliz_pg:
  bakliz_backend_data:
  bakliz_n8n:
